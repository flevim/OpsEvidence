name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + analyse + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Los servicios de GitHub Actions se publican en localhost para jobs que
      # corren directo en el runner. Los nombres 'postgres' y 'redis' solo
      # resuelven dentro de la red de Docker Compose.
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsevidence
          POSTGRES_USER: opsevidence
          POSTGRES_PASSWORD: opsevidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsevidence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, bcmath, pcntl, zip
          coverage: none
          tools: composer:v2

      - name: Crear base de datos de tests
        run: PGPASSWORD=opsevidence psql -h 127.0.0.1 -U opsevidence -d opsevidence -c "CREATE DATABASE opsevidence_test"
        env:
          PGPASSWORD: opsevidence

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Comprobar conexión a la base de datos
        run: |
          php -r '
            $host = getenv("DB_HOST") ?: "127.0.0.1";
            echo "DB_HOST resuelto: " . (getenv("DB_HOST") ?: "(vacio, se usa 127.0.0.1)") . PHP_EOL;
            try {
              new PDO("pgsql:host=" . $host . ";port=5432;dbname=opsevidence_test", "opsevidence", "opsevidence");
              echo "CONEXION OK" . PHP_EOL;
            } catch (Throwable $e) {
              echo "FALLO DE CONEXION: " . $e->getMessage() . PHP_EOL;
              exit(1);
            }
          '

      - name: Tests (Pest)
        run: php artisan test

      - name: Registro de Laravel (solo si algo falló)
        if: failure()
        run: tail -80 storage/logs/laravel.log || true

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Smoke E2E (Compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del navegador
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Levantar el MVP completo
        run: docker compose up -d --build --wait

      - name: Smoke test
        working-directory: frontend
        run: npm run test:e2e

      - name: Logs de los servicios (solo si algo falló)
        if: failure()
        run: docker compose logs --tail 200

      - name: Limpiar Compose
        if: always()
        run: docker compose down -v

  agent:
    name: Agent (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  security:
    name: Security (Gitleaks + Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detección de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Análisis de configuración (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
