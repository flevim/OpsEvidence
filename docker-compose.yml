name: opsevidence

x-backend: &backend
  build:
    context: ./docker/php
  image: opsevidence/backend:dev
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - backend_storage:/var/www/html/storage
    - backend_bootstrap_cache:/var/www/html/bootstrap/cache
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5180}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5180}
  networks:
    - opsevidence

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsevidence}
      POSTGRES_USER: ${POSTGRES_USER:-opsevidence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsevidence}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsevidence} -d ${POSTGRES_DB:-opsevidence}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - opsevidence

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - opsevidence

  init:
    <<: *backend
    command: ["opsevidence-init"]
    restart: "no"
    environment:
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

  backend:
    <<: *backend
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=30", "--max-time=3600", "--sleep=3", "--queue=default,checks,rules,alerts"]
    restart: unless-stopped

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work", "--verbose"]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 200
    networks:
      - opsevidence

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
      CHOKIDAR_USEPOLLING: "true"
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - opsevidence

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache:
  frontend_node_modules:

networks:
  opsevidence:
    driver: bridge
