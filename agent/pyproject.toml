[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsevidence-agent"
version = "1.0.0"
description = "Agente read-only de recolección de evidencia para OpsEvidence."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "proprietary" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "responses>=0.23",
]

[project.scripts]
opsevidence-agent = "opsevidence_agent.cli:main"

[tool.setuptools.packages.find]
include = ["opsevidence_agent*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
